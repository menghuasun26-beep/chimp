<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="黑猩猩">
<meta name="theme-color" content="#12161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>黑猩猩记忆</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12161c;
    --fg: #e8edf3;
    --muted: #8a96a5;
    --panel: #1c222b;
    --line: rgba(255, 255, 255, .12);
    --tile: #2a6fdb;
    --block: #f2f4f7;
    --wrong: #e5484d;
    --up: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body {
    /* 固定定位,杜绝 iOS 回弹滚动 */
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button {
    appearance: none;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
  }

  header {
    flex: none;
    display: flex;
    justify-content: center;
    padding: 12px 16px 4px;
  }
  #levelBtn {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
  }
  #levelBtn .lbl, #levelBtn .caret { font-size: 14px; color: var(--muted); }
  #levelNum {
    min-width: 2ch;
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    transition: color .4s;
  }
  #levelNum.up { color: var(--up); transition: none; }
  #levelNum.down { color: var(--wrong); transition: none; }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 8px 12px;
    container-type: size;
    touch-action: none;
  }
  #grid {
    /* 5 列 × 8 行,按可用宽高取较小者铺满 */
    --gw: min(100cqw, 100cqh * 5 / 8);
    width: var(--gw);
    aspect-ratio: 5 / 8;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: calc(var(--gw) * .03);
  }
  .cell {
    display: grid;
    place-items: center;
    border-radius: 12%;
    color: #fff;
    font-size: calc(var(--gw) * .1);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .cell.show { background: var(--tile); }
  .cell.hide { background: var(--block); }
  .cell.wrong { background: var(--wrong); }

  footer {
    flex: none;
    height: 44px;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 15px;
  }

  #sheet {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(0, 0, 0, .55);
  }
  #sheet[hidden] { display: none; }
  .panel {
    width: min(100%, 340px);
    display: grid;
    gap: 20px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
  }
  .panel h2 {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
  }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stepper button {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid var(--line);
    font-size: 28px;
    line-height: 1;
  }
  .stepper button:active { background: var(--line); }
  #pick {
    font-size: 48px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #range { width: 100%; accent-color: var(--tile); }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .actions button {
    height: 48px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
  }
  #cancel { border: 1px solid var(--line); }
  #ok { background: var(--tile); color: #fff; }
</style>
</head>
<body>
<header>
  <button id="levelBtn" type="button" aria-label="调整等级">
    <span class="lbl">等级</span><span id="levelNum"></span><span class="caret">▾</span>
  </button>
</header>
<main>
  <div id="grid"></div>
</main>
<footer id="hint"></footer>

<div id="sheet" hidden>
  <div class="panel">
    <h2>调整等级</h2>
    <div class="stepper">
      <button id="minus" type="button" aria-label="减一">−</button>
      <output id="pick"></output>
      <button id="plus" type="button" aria-label="加一">+</button>
    </div>
    <input id="range" type="range" step="1">
    <div class="actions">
      <button id="cancel" type="button">取消</button>
      <button id="ok" type="button">确定</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const COLS = 5, ROWS = 8, CELLS = COLS * ROWS;
  const MIN = 4, MAX = CELLS;
  const KEY = 'chimp-level';
  const NEXT_DELAY = 250;  // 过关后出下一题的间隔(ms)
  const FAIL_GUARD = 300;  // 出错后这段时间内的点击不算"继续",防止连点跳过答案

  const $ = id => document.getElementById(id);
  const gridEl = $('grid'), levelBtn = $('levelBtn'), levelNum = $('levelNum'), hint = $('hint');
  const sheet = $('sheet'), pick = $('pick'), range = $('range');

  const clamp = n => Math.min(MAX, Math.max(MIN, n));

  function load() {
    try {
      const n = parseInt(localStorage.getItem(KEY), 10);
      return Number.isFinite(n) ? clamp(n) : MIN;
    } catch {
      return MIN;
    }
  }

  function save() {
    try { localStorage.setItem(KEY, String(level)); } catch {}
  }

  let level = load();
  const board = new Array(CELLS).fill(0);  // 每格的数字,0 表示空
  let count = 0;          // 本题数字个数
  let next = 1;           // 下一个该点的数字
  let phase = 'ready';    // ready: 数字可见  playing: 已隐藏  failed: 出错待继续  busy: 过关间隔
  let failedAt = 0;
  let timer = 0;
  let flashTimer = 0;

  const cells = [];
  for (let i = 0; i < CELLS; i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.dataset.i = i;
    gridEl.appendChild(el);
    cells.push(el);
  }

  function paint(i, mode) {
    const el = cells[i];
    el.className = 'cell ' + mode;
    el.textContent = mode === 'show' || mode === 'wrong' ? board[i] : '';
  }

  function setLevel(n, flash) {
    level = clamp(n);
    save();
    levelNum.textContent = level;
    if (!flash) return;
    levelNum.classList.remove('up', 'down');
    void levelNum.offsetWidth;
    levelNum.classList.add(flash);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => levelNum.classList.remove(flash), 350);
  }

  function newRound() {
    clearTimeout(timer);
    board.fill(0);
    count = level;
    const idx = Array.from({ length: CELLS }, (_, i) => i);
    for (let k = 0; k < count; k++) {
      const r = k + Math.floor(Math.random() * (CELLS - k));
      [idx[k], idx[r]] = [idx[r], idx[k]];
      board[idx[k]] = k + 1;
    }
    next = 1;
    phase = 'ready';
    hint.textContent = '';
    for (let i = 0; i < CELLS; i++) paint(i, board[i] ? 'show' : 'empty');
  }

  function tap(i) {
    const n = board[i];
    if (!n) return;
    if (n !== next) return fail(i);
    board[i] = 0;
    paint(i, 'empty');
    if (next === 1) {
      phase = 'playing';
      for (let j = 0; j < CELLS; j++) if (board[j]) paint(j, 'hide');
    }
    if (next === count) {
      phase = 'busy';
      setLevel(level + 1, 'up');
      timer = setTimeout(newRound, NEXT_DELAY);
    } else {
      next++;
    }
  }

  function fail(i) {
    phase = 'failed';
    failedAt = performance.now();
    for (let j = 0; j < CELLS; j++) if (board[j]) paint(j, j === i ? 'wrong' : 'show');
    setLevel(level - 1, 'down');
    hint.textContent = '点击任意处继续';
  }

  // 按下即判定,不等手指抬起
  document.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !sheet.hidden || levelBtn.contains(e.target)) return;
    if (phase === 'failed') {
      if (performance.now() - failedAt > FAIL_GUARD) newRound();
      return;
    }
    if (phase !== 'ready' && phase !== 'playing') return;
    const el = e.target.closest('.cell');
    if (el) tap(+el.dataset.i);
  });

  // 屏蔽 iOS 双指缩放
  document.addEventListener('gesturestart', e => e.preventDefault());

  range.min = MIN;
  range.max = MAX;

  function setPick(n) {
    n = clamp(n);
    pick.textContent = n;
    range.value = n;
  }

  levelBtn.addEventListener('click', () => {
    setPick(level);
    sheet.hidden = false;
  });
  $('minus').addEventListener('click', () => setPick(+range.value - 1));
  $('plus').addEventListener('click', () => setPick(+range.value + 1));
  range.addEventListener('input', () => setPick(+range.value));
  $('cancel').addEventListener('click', () => { sheet.hidden = true; });
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
  $('ok').addEventListener('click', () => {
    sheet.hidden = true;
    setLevel(+range.value);
    newRound();
  });

  levelNum.textContent = level;
  newRound();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
