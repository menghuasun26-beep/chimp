<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="伪人检测器">
<meta name="theme-color" content="#12161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>伪人检测器</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12161c;
    --fg: #e8edf3;
    --muted: #8a96a5;
    --panel: #1c222b;
    --line: rgba(255, 255, 255, .12);
    --tile: #2a6fdb;
    --block: #f2f4f7;
    --wrong: #e5484d;
    --up: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body {
    /* 固定定位,杜绝 iOS 回弹滚动 */
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button {
    appearance: none;
    border: 0;
    padding: 0;
    background: none;
    color: inherit;
    font: inherit;
  }

  /* ---------- 顶栏 ---------- */
  header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px 6px;
  }
  .pill {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    white-space: nowrap;
  }
  .caret { font-size: 12px; color: var(--muted); }
  #modeName { font-size: 16px; font-weight: 700; }
  .stats { display: flex; align-items: center; gap: 10px; }
  #levelLbl, #levelUnit { font-size: 13px; color: var(--muted); }
  #levelNum {
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    transition: color .4s;
  }
  .best { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #bestNum {
    color: var(--fg);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: color .4s;
  }
  #levelNum.up, #bestNum.up { color: var(--up); transition: none; }
  #levelNum.down { color: var(--wrong); transition: none; }

  /* ---------- 公共布局 ---------- */
  main { flex: 1; min-height: 0; display: flex; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .center {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 0 16px;
    text-align: center;
  }
  .fill { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .top-line {
    flex: none;
    height: 28px;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    flex: none;
    height: 44px;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 15px;
  }
  .board {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 8px 12px;
    container-type: size;
    touch-action: none;
  }
  .cta { font-size: 24px; font-weight: 700; }
  .cta small {
    display: block;
    margin-top: 10px;
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
  }
  .result-title { font-size: 40px; font-weight: 800; }
  .result.ok .result-title { color: var(--up); }
  .result.bad .result-title { color: var(--wrong); }
  .result-line { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .ok-mark { font-size: 72px; font-weight: 800; color: var(--up); }

  /* ---------- 黑猩猩 ---------- */
  .chimp-grid {
    /* 5 列 × 8 行,按可用宽高取较小者铺满 */
    --gw: min(100cqw, 100cqh * 5 / 8);
    width: var(--gw);
    aspect-ratio: 5 / 8;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: calc(var(--gw) * .03);
  }
  .chimp-grid .cell {
    display: grid;
    place-items: center;
    border-radius: 12%;
    color: #fff;
    font-size: calc(var(--gw) * .1);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .chimp-grid .show { background: var(--tile); }
  .chimp-grid .hide { background: var(--block); }
  .chimp-grid .wrong { background: var(--wrong); }

  /* ---------- 数字广度 ---------- */
  .span-view { font-size: 96px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .span-view.fix { color: var(--muted); font-weight: 400; }
  .slots {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 340px;
  }
  .slots span {
    width: 28px;
    height: 44px;
    border-bottom: 2px solid var(--line);
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .cmp { display: grid; gap: 14px; }
  .cmp div { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .12em; }
  .cmp .lbl { margin-right: 10px; font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .cmp .bad { color: var(--wrong); }
  .keypad {
    flex: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 0 16px 4px;
    transition: opacity .2s;
  }
  .keypad button {
    height: 58px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    font-size: 26px;
    font-weight: 600;
  }
  .keypad button:active { background: var(--line); }
  .keypad button.blank { visibility: hidden; }
  .keypad.off { opacity: .3; }

  /* ---------- 记忆宫殿 ---------- */
  .word { font-size: 56px; font-weight: 800; }
  .palace-grid {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-content: start;
    gap: 8px;
    padding: 4px 16px 8px;
    touch-action: pan-y;
  }
  .palace-grid button {
    position: relative;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    font-size: 16px;
  }
  .palace-grid .done { opacity: .35; }
  .palace-grid .target { background: var(--tile); border-color: transparent; }
  .palace-grid .wrong { background: var(--wrong); border-color: transparent; }
  .palace-grid .dim { opacity: .3; }
  .palace-grid .badge {
    position: absolute;
    top: 2px;
    left: 5px;
    font-size: 11px;
    font-weight: 700;
  }

  /* ---------- Stroop ---------- */
  .stroop-word { font-size: 120px; font-weight: 800; line-height: 1; }
  .fix { font-size: 48px; color: var(--muted); }
  .stroop-miss { font-size: 40px; font-weight: 800; color: var(--wrong); }
  .swatches {
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 4px;
  }
  .swatches button { height: 84px; border-radius: 16px; }
  .swatches button:active { filter: brightness(.8); }

  /* ---------- 舒尔特 ---------- */
  .timebar {
    flex: none;
    height: 6px;
    margin: 0 16px;
    border-radius: 3px;
    background: var(--panel);
    overflow: hidden;
  }
  .timebar i {
    display: block;
    height: 100%;
    background: var(--tile);
    transform-origin: left;
  }
  .schulte-grid {
    --gw: min(100cqw, 100cqh);
    width: var(--gw);
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: calc(var(--gw) * .02);
  }
  .schulte-grid .cell {
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 10%;
    background: var(--panel);
    font-size: calc(var(--gw) * .075);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .schulte-grid .ok { background: var(--tile); }
  .schulte-grid .bad { background: var(--wrong); }

  /* ---------- 弹出面板 ---------- */
  .sheet {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(0, 0, 0, .55);
  }
  .sheet[hidden] { display: none; }
  .panel {
    width: min(100%, 340px);
    display: grid;
    gap: 20px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
  }
  .panel h2 {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
  }
  .mode-list { display: grid; gap: 8px; }
  .mode-list button {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
  }
  .mode-list button.cur { border-color: var(--tile); background: rgba(42, 111, 219, .15); }
  .mode-list .sub { font-size: 13px; font-weight: 400; color: var(--muted); }
  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stepper button {
    width: 56px;
    height: 56px;
    border: 1px solid var(--line);
    border-radius: 50%;
    font-size: 28px;
    line-height: 1;
  }
  .stepper button:active { background: var(--line); }
  #pick {
    font-size: 44px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #range { width: 100%; accent-color: var(--tile); }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .actions button {
    height: 48px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
  }
  #cancel { border: 1px solid var(--line); }
  #ok { background: var(--tile); color: #fff; }
</style>
</head>
<body>
<header>
  <button id="modeBtn" class="pill" type="button" aria-label="切换训练">
    <span id="modeName"></span><span class="caret">▾</span>
  </button>
  <div class="stats">
    <button id="levelBtn" class="pill" type="button" aria-label="调整等级">
      <span id="levelLbl"></span><span id="levelNum"></span><span id="levelUnit"></span><span class="caret">▾</span>
    </button>
    <span class="best">最佳 <b id="bestNum"></b></span>
  </div>
</header>
<main id="main"></main>

<div id="modeSheet" class="sheet" hidden>
  <div class="panel">
    <h2>选择训练</h2>
    <div id="modeList" class="mode-list"></div>
  </div>
</div>

<div id="levelSheet" class="sheet" hidden>
  <div class="panel">
    <h2 id="levelTitle"></h2>
    <div class="stepper">
      <button id="minus" type="button" aria-label="减少">−</button>
      <output id="pick"></output>
      <button id="plus" type="button" aria-label="增加">+</button>
    </div>
    <input id="range" type="range">
    <div class="actions">
      <button id="cancel" type="button">取消</button>
      <button id="ok" type="button">确定</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
